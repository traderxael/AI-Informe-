<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analítica — AI Informe</title>
<link rel="icon" href="/favicon.svg">
<style>
:root{--bg:#080d13;--stroke:rgba(174,194,212,.14);--text:#f1f5f3;--muted:#a2afb9;--subtle:#82909c;--blue:#9cbcff;--mint:#8ce0b7}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:radial-gradient(900px 580px at 6% -8%,rgba(74,178,143,.14),transparent 62%),radial-gradient(1000px 600px at 96% 8%,rgba(77,141,255,.13),transparent 60%),var(--bg);color:var(--text);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI Variable","Segoe UI",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.container{max-width:1000px;margin:auto;padding:48px 20px 80px}
.eyebrow{color:var(--mint);font-size:11px;font-weight:700;letter-spacing:.19em;text-transform:uppercase}
h1{margin:12px 0 6px;font-size:clamp(1.8rem,5vw,3rem);letter-spacing:-.04em}
.sub{color:var(--muted);font-size:13px;max-width:640px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0}
.card{border:1px solid var(--stroke);border-radius:16px;padding:16px;background:rgba(255,255,255,.03);text-align:center}
.card strong{display:block;font-size:26px;letter-spacing:-.03em}
.card span{color:var(--subtle);font-size:10px;text-transform:uppercase;letter-spacing:.1em}
.panel{border:1px solid var(--stroke);border-radius:20px;padding:20px;margin-top:16px;background:rgba(255,255,255,.02)}
.panel h2{margin:0 0 12px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--subtle);font-weight:700}
.row{display:flex;align-items:center;gap:12px;margin-top:8px}
.row .lbl{width:150px;flex:none;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{flex:1;height:14px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.06)}
.fill{height:100%;background:linear-gradient(90deg,#4d8dff,#83e5be);border-radius:999px}
.val{width:52px;text-align:right;font-size:12px;color:var(--muted)}
.note{margin-top:12px;color:var(--subtle);font-size:11px}
.back{display:inline-block;margin-top:22px;color:var(--blue);text-decoration:none;font-size:13px}
.back:hover{text-decoration:underline}
@media(max-width:720px){.cards{grid-template-columns:repeat(2,1fr)}.row .lbl{width:96px}}
</style>
</head>
<body>
<main class="container">
  <p class="eyebrow">AI Informe · Analítica</p>
  <h1>Analítica del sitio</h1>
  <p class="sub">First-party, sin cookies y sin terceros. Se registra la página, el referente y el día — nunca datos personales.</p>
  <div id="app"><p class="sub">Cargando…</p></div>
  <a class="back" href="/">← Volver al informe</a>
</main>
<script src="/analitica.js" defer></script>
</body>
</html>
