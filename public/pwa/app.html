<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0a0a0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>AI Informe</title>
  <link rel="manifest" href="/pwa/manifest.json">
  <link rel="icon" href="/pwa/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/pwa/icons/icon-192.png">
  <link rel="stylesheet" href="/web/styles.css">
  <style>
    /* PWA Mobile App Shell */
    body {
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }
    .pwa-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: linear-gradient(135deg, #1a1a2e 0%, #16162a 100%);
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .pwa-header h1 {
      font-size: 1.1rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0;
    }
    .pwa-header .badge {
      font-size: 0.6rem;
      background: var(--accent);
      color: white;
      padding: 0.2rem 0.5rem;
      border-radius: 999px;
      font-weight: 700;
    }
    .pwa-nav {
      display: flex;
      gap: 0.25rem;
      overflow-x: auto;
      padding: 0.5rem 1rem;
      scrollbar-width: none;
      -ms-overflow-style: none;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .pwa-nav::-webkit-scrollbar { display: none; }
    .pwa-nav-btn {
      flex-shrink: 0;
      padding: 0.4rem 0.8rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .pwa-nav-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    .pwa-content {
      padding: 1rem;
      padding-bottom: 4rem;
      max-width: 600px;
      margin: 0 auto;
    }
    .pwa-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      margin-bottom: 0.75rem;
      transition: all 0.2s;
    }
    .pwa-card:active {
      transform: scale(0.98);
    }
    .pwa-card h3 {
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
      color: var(--text);
    }
    .pwa-card .meta {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }
    .pwa-card .summary {
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.4;
    }
    .pwa-card .tag {
      display: inline-block;
      font-size: 0.6rem;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      background: var(--surface2);
      color: var(--accent2);
      margin-right: 0.25rem;
      margin-bottom: 0.25rem;
    }
    .pwa-section-title {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent2);
      margin: 1.5rem 0 0.75rem;
      font-weight: 700;
    }
    .pwa-footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 0.5rem 1rem;
      display: flex;
      justify-content: center;
      gap: 2rem;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .pwa-footer a {
      color: var(--text-muted);
      font-size: 0.7rem;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.15rem;
    }
    .pwa-footer a.active {
      color: var(--accent);
    }
    .pwa-footer .icon {
      font-size: 1.2rem;
    }
    .install-btn {
      position: fixed;
      bottom: 4rem;
      right: 1rem;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 999px;
      padding: 0.6rem 1rem;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: var(--shadow);
      display: none;
      z-index: 99;
    }
    .loading {
      text-align: center;
      padding: 2rem;
      color: var(--text-muted);
    }
    .skeleton {
      background: linear-gradient(90deg, var(--surface) 25%, var(--surface2) 50%, var(--surface) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: var(--radius);
      height: 80px;
      margin-bottom: 0.75rem;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>
<body>
  <header class="pwa-header">
    <h1>AI Informe</h1>
    <span class="badge">HOY</span>
  </header>

  <nav class="pwa-nav" id="pwaNav">
    <button class="pwa-nav-btn active" data-filter="all">Todos</button>
    <button class="pwa-nav-btn" data-filter="ia">IA</button>
    <button class="pwa-nav-btn" data-filter="china">China</button>
    <button class="pwa-nav-btn" data-filter="tech">Nuevas Tech</button>
    <button class="pwa-nav-btn" data-filter="guerra">Guerra</button>
    <button class="pwa-nav-btn" data-filter="mercados">Mercados</button>
  </nav>

  <main class="pwa-content" id="pwaContent">
    <div class="loading">
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <p>Cargando informes…</p>
    </div>
  </main>

  <button class="install-btn" id="installBtn">📲 Instalar App</button>

  <footer class="pwa-footer">
    <a href="/" class="active" data-nav="home">
      <span class="icon">📰</span>
      Inicio
    </a>
    <a href="/pwa/app.html" data-nav="app">
      <span class="icon">📱</span>
      App
    </a>
    <a href="https://github.com/traderxael/AI-Informe-" target="_blank" rel="noopener" data-nav="repo">
      <span class="icon">💻</span>
      Repo
    </a>
  </footer>

  <script src="./app.js" defer></script>
</body>
</html>
