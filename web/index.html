<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Informe</title>
  <meta name="description" content="Recopilación diaria de noticias de IA, usos reales, economía y señales de futuro.">
  <meta property="og:title" content="AI Informe">
  <meta property="og:description" content="Recopilación diaria de noticias de IA">
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="logo">
        <h1>AI Informe</h1>
        <p>El resumen diario de IA</p>
      </div>

      <div class="stats">
        <div class="stat"><span class="num" id="s-total">0</span><span class="label">Días</span></div>
        <div class="stat"><span class="num" id="s-items">0</span><span class="label">Items</span></div>
        <div class="stat"><span class="num" id="s-fuentes">0</span><span class="label">Fuentes</span></div>
      </div>

      <nav class="nav">
        <h3>📅 Informes</h3>
        <div id="nav-list"><p class="loading">Cargando...</p></div>
      </nav>

      <div class="search-box">
        <input type="search" id="search" placeholder="🔍 Buscar...">
      </div>
    </aside>

    <main class="main">
      <div id="loading" class="loading-overlay">
        <div class="spinner"></div>
        <p>Cargando...</p>
      </div>
      <div id="contenido">
        <div class="hero">
          <h2>🤖 AI Informe</h2>
          <p>Elige un día para ver el resumen</p>
        </div>
      </div>
    </main>
  </div>

<script>
let historial = [];
let allItems = [];

async function init() {
  try {
    const res = await fetch('informes-data.json');
    historial = await res.json();
    
    let totalItems = 0, fuentes = new Set();
    historial.forEach(d => {
      totalItems += d.total;
      Object.values(d.por_seccion || {}).flat().forEach(n => fuentes.add(n.fuente));
    });
    document.getElementById('s-total').textContent = historial.length;
    document.getElementById('s-items').textContent = totalItems;
    document.getElementById('s-fuentes').textContent = fuentes.size;

    renderNav(historial);
    if (historial.length) cargarDia(historial[historial.length-1]);
  } catch(e) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('contenido').innerHTML = `<div class="error"><h3>⚠️ Error</h3><p>${e.message}</p></div>`;
  }
}

function renderNav(datos) {
  const nav = document.getElementById('nav-list');
  nav.innerHTML = datos.slice().reverse().map(d => `
    <a href="#" class="nav-item" data-fecha="${d.fecha}">
      <span>${d.fecha}</span><span class="badge">${d.total}</span>
    </a>
  `).join('');
  
  nav.querySelectorAll('.nav-item').forEach(el => {
    el.onclick = e => {
      e.preventDefault();
      document.querySelectorAll('.nav-item').forEach(x => x.classList.remove('active'));
      el.classList.add('active');
      cargarDia(historial.find(d => d.fecha === el.dataset.fecha));
    };
  });
}

function cargarDia(dia) {
  document.getElementById('loading').style.display = 'flex';
  const sections = [
    {key: 'novedades', title: '📰 Novedades'},
    {key: 'usos', title: '🌍 Usos en el mundo'},
    {key: 'economia', title: '💰 Economía'},
    {key: 'futuro', title: '🔮 Futuro'}
  ];
  
  let html = `<header class="informe-header"><h2>📅 ${formatDate(dia.fecha)}</h2><p>${dia.total} noticias de ${dia.fuentes?.length || 0} fuentes</p></header><div class="noticias">`;
  
  sections.forEach(sec => {
    const items = dia.por_seccion?.[sec.key] || [];
    if (items.length) {
      html += `<section class="seccion"><h3>${sec.title} <span>${items.length}</span></h3>`;
      items.forEach(n => {
        html += `<article class="noticia"><h4><a href="${n.url}" target="_blank">${esc(n.titulo)}</a></h4><div class="meta"><span class="fuente">${esc(n.fuente)}</span></div>${n.resumen ? `<p class="resumen">${esc(n.resumen)}</p>` : ''}</article>`;
      });
      html += '</section>';
    }
  });
  
  html += '</div>';
  document.getElementById('contenido').innerHTML = html;
  document.getElementById('loading').style.display = 'none';
  allItems = Object.values(dia.por_seccion || {}).flat();
}

function formatDate(f) {
  return new Date(f + 'T00:00:00').toLocaleDateString('es-ES', {weekday:'long', day:'numeric', month:'long'});
}

function esc(text) { const d = document.createElement('div'); d.textContent = text; return d.innerHTML; }

document.getElementById('search').oninput = e => {
  const q = e.target.value.toLowerCase();
  if (!q) { if (historial.length) cargarDia(historial[historial.length-1]); return; }
  const results = allItems.filter(n => n.titulo.toLowerCase().includes(q) || n.resumen?.toLowerCase().includes(q));
  if (results.length) {
    document.getElementById('contenido').innerHTML = `<header class="informe-header"><h2>🔍 ${results.length} resultados</h2></header><div class="noticias">${results.map(n => `<article class="noticia"><h4><a href="${n.url}" target="_blank">${esc(n.titulo)}</a></h4><span class="fuente">${esc(n.fuente)}</span></article>`).join('')}</div>`;
  }
};

init();
</script>
</body>
</html>
