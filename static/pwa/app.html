<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#fafafa">
  <link rel="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>AI Informe</title>
  <link rel="manifest" href="/static/pwa/manifest.json">
  <link rel="icon" href="/static/pwa/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/static/pwa/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --surface: #ffffff;
      --surface2: #f6f5f4;
      --border: rgba(0,0,0,0.1);
      --text: rgba(0,0,0,0.95);
      --text-muted: #615d59;
      --text-light: #a39e98;
      --accent: #0075de;
      --accent2: #097fe8;
      --green: #1aae39;
      --orange: #dd5b00;
      --red: #d45656;
      --radius: 12px;
      --shadow: rgba(0,0,0,0.04) 0px 4px 18px, rgba(0,0,0,0.027) 0px 2.025px 7.84688px, rgba(0,0,0,0.02) 0px 0.8px 2.925px, rgba(0,0,0,0.01) 0px 0.175px 1.04062px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }

    /* Header estilo Notion */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header h1 {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.021em;
      color: var(--text);
    }

    .header .period {
      font-size: 0.65rem;
      font-weight: 500;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.125px;
    }

    /* Filtros estilo Notion */
    .filters {
      display: flex;
      gap: 0.4rem;
      padding: 0.6rem 1.25rem;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .filters::-webkit-scrollbar { display: none; }

    .filter-btn {
      flex-shrink: 0;
      padding: 0.4rem 0.875rem;
      border-radius: 4px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .filter-btn:hover {
      background: rgba(0,0,0,0.05);
      color: var(--text);
    }

    .filter-btn.active {
      background: var(--accent);
      color: white;
    }

    /* Contenido principal */
    .content {
      max-width: 720px;
      margin: 0 auto;
      padding: 1rem 1.25rem 5rem;
    }

    /* Título de sección */
    .section-title {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      margin: 2rem 0 1rem;
      font-weight: 600;
    }

    /* Cards estilo Notion */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      margin-bottom: 0.625rem;
      transition: all 0.15s;
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .card:hover {
      box-shadow: var(--shadow);
    }

    .card:active {
      transform: scale(0.995);
    }

    .card .date {
      font-size: 0.7rem;
      color: var(--text-muted);
      font-weight: 500;
      margin-bottom: 0.375rem;
      letter-spacing: 0.025em;
    }

    .card h3 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 0.375rem;
      letter-spacing: -0.025px;
      color: var(--text);
      line-height: 1.27;
    }

    .card .summary {
      font-size: 0.8125rem;
      color: var(--text-muted);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Badge estilo Notion pill */
    .card .tag {
      display: inline-block;
      font-size: 0.625rem;
      padding: 0.15rem 0.4rem;
      border-radius: 9999px;
      background: #f2f9ff;
      color: var(--accent2);
      margin-top: 0.5rem;
      font-weight: 600;
      letter-spacing: 0.125px;
    }

    /* Tags con colores por categoría */
    .card .tag.ia { background: #f2f9ff; color: #097fe8; }
    .card .tag.china { background: #fff5f5; color: #d45656; }
    .card .tag.tech { background: #f0fdf4; color: #16a34a; }
    .card .tag.guerra { background: #fffbeb; color: #d97706; }
    .card .tag.mercados { background: #fdf4ff; color: #9333ea; }

    /* Footer estilo Notion */
    .footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-top: 1px solid var(--border);
      padding: 0.5rem 1rem;
      display: flex;
      justify-content: center;
      gap: 3rem;
    }

    .footer a {
      color: var(--text-muted);
      font-size: 0.65rem;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.1rem;
      font-weight: 500;
      transition: color 0.15s;
    }

    .footer a:hover, .footer a.active {
      color: var(--accent);
    }

    .footer .icon {
      font-size: 1.25rem;
      line-height: 1;
    }

    .install-btn {
      position: fixed;
      bottom: 4.5rem;
      right: 1rem;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 4px;
      padding: 0.5rem 1rem;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: var(--shadow);
      display: none;
      z-index: 99;
    }

    .install-btn:hover {
      background: var(--accent2);
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .skeleton {
      background: linear-gradient(90deg, var(--surface) 25%, var(--surface2) 50%, var(--surface) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: var(--radius);
      height: 90px;
      margin-bottom: 0.625rem;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    @media (min-width: 768px) {
      .content { padding: 1.5rem 2rem 5rem; }
      .card { padding: 1.5rem; }
    }
  </style>
</head>
<body>
  <header class="header">
    <h1>AI Informe</h1>
    <span class="period">Semanal</span>
  </header>

  <nav class="filters" id="filters">
    <button class="filter-btn active" data-filter="all">Todos</button>
    <button class="filter-btn" data-filter="ia">IA</button>
    <button class="filter-btn" data-filter="china">China</button>
    <button class="filter-btn" data-filter="tech">Nuevas Tech</button>
    <button class="filter-btn" data-filter="guerra">Guerra</button>
    <button class="filter-btn" data-filter="mercados">Mercados</button>
  </nav>

  <main class="content" id="content">
    <div class="loading">
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <p>Cargando…</p>
    </div>
  </main>

  <button class="install-btn" id="installBtn">Instalar App</button>

  <footer class="footer">
    <a href="/" class="active" data-nav="home">
      <span class="icon">📰</span>
      Inicio
    </a>
    <a href="/static/pwa/app.html" data-nav="app">
      <span class="icon">📱</span>
      App
    </a>
    <a href="https://github.com/traderxael/AI-Informe-" target="_blank" rel="noopener" data-nav="repo">
      <span class="icon">💻</span>
      Repo
    </a>
  </footer>

  <script>
    // Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js', { scope: '/' })
          .then(reg => console.log('SW:', reg.scope))
          .catch(err => console.log('SW fail:', err));
      });
    }

    // Install prompt
    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'block';
    });
    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') installBtn.style.display = 'none';
      deferredPrompt = null;
    });

    // State
    let allReports = [];
    let currentFilter = 'all';

    const content = document.getElementById('content');
    const filters = document.getElementById('filters');

    // Filter click
    filters.addEventListener('click', (e) => {
      if (!e.target.dataset.filter) return;
      currentFilter = e.target.dataset.filter;
      filters.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn === e.target);
      });
      render();
    });

    // Footer nav
    document.querySelectorAll('[data-nav]').forEach(link => {
      link.addEventListener('click', (e) => {
        document.querySelectorAll('[data-nav]').forEach(l => l.classList.remove('active'));
        e.currentTarget.classList.add('active');
      });
    });

    // Cargar informes
    async function loadReports() {
      try {
        const res = await fetch('/web/informes.json');
        const data = await res.json();
        allReports = data.map(r => ({
          ...r,
          category: categorize(r.title, r.summary)
        }));
        render();
      } catch (err) {
        content.innerHTML = '<div class="loading"><p>No se pudieron cargar los informes.</p></div>';
      }
    }

    function categorize(title, summary) {
      const text = (title + ' ' + summary).toLowerCase();
      if (text.includes('guerra') || text.includes('oil') || text.includes('ucrania') || text.includes('saudi') || text.includes('iran') || text.includes('ducto') || text.includes('energía')) return 'guerra';
      if (text.includes('shanghai') || text.includes('hang seng') || text.includes('s&p') || text.includes('ftse') || text.includes('mercado') || text.includes('stock') || text.includes('compuesto')) return 'mercados';
      if (text.includes('deepseek') || text.includes('enflame') || text.includes('huawei') || text.includes('china') || text.includes('moonshot') || text.includes('kimi')) return 'china';
      if (text.includes('quantum') || text.includes('fusion') || text.includes('perovskite') || text.includes('robot') || text.includes('tech') || text.includes('tecnolog') || text.includes('6g')) return 'tech';
      return 'ia';
    }

    function render() {
      const filtered = currentFilter === 'all'
        ? allReports
        : allReports.filter(r => r.category === currentFilter);

      if (filtered.length === 0) {
        content.innerHTML = '<div class="loading"><p>No hay informes aquí.</p></div>';
        return;
      }

      const sections = {
        ia: 'Inteligencia Artificial',
        china: 'China y Tecnología',
        tech: 'Nuevas Tecnologías',
        guerra: 'Guerra y Geopolítica',
        mercados: 'Mercados'
      };

      let html = '';
      const grouped = {};
      filtered.forEach(r => {
        if (!grouped[r.category]) grouped[r.category] = [];
        grouped[r.category].push(r);
      });

      for (const [cat, reports] of Object.entries(grouped)) {
        html += `<h2 class="section-title">${sections[cat] || cat}</h2>`;
        reports.forEach(r => {
          const title = r.title || 'Informe';
          const summary = (r.summary || '').substring(0, 140);
          const link = r.file || '#';
          html += `
            <a href="/web/${link}" class="card">
              <div class="date">${r.date}</div>
              <h3>${title}</h3>
              <div class="summary">${summary}…</div>
              <span class="tag ${cat}">${cat}</span>
            </a>
          `;
        });
      }

      content.innerHTML = html;
    }

    loadReports();
  </script>
</body>
</html>
