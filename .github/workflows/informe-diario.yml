name: Informe diario

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: informe-diario
  cancel-in-progress: false

jobs:
  # Publicacion del dia: SOLO Python (stdlib). El 25-oct-2026 un lockfile
  # desincronizado hizo fallar `npm ci` y el dia se perdio entero: el informe
  # no se genero ni se commiteo. Los gates del frontend viven en `gate-web`,
  # que corre EN PARALELO, pinta el run en rojo si algo se rompe, pero NUNCA
  # puede impedir la publicacion del informe.
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      # Python puro: cubre clasificacion, feeds, salud y el detector de agujeros.
      - name: Tests de clasificación y pipeline
        run: python scripts/test_pipeline.py

      - name: Generar informe (markdown + web)
        run: python scripts/generar_informe.py

      # Feed propio (RSS + JSON Feed) para que cualquiera pueda suscribirse
      # al informe diario. Soft-fail: si falla, el informe se publica igual.
      - name: Publicar feed RSS/JSON
        continue-on-error: true
        run: python scripts/generar_feed.py

      # Self-healing: si un dia previo quedo sin informe (cron caido, GitHub
      # abajo, npm roto), se regenera mientras los feeds todavia traen los
      # items (ventana de lookback de 7 dias). Los agujeros mas viejos se
      # listan en el log. Advisory: nunca tumba la publicacion del dia.
      - name: Auto-reparar agujeros recientes
        continue-on-error: true
        run: python scripts/reparar_agujeros.py

      - name: Recolectar signals reales (Google News + RSS + Reddit + HN)
        run: python scripts/collect_signals.py
        env:
          TRANSLATE_MAX: "40"

      - name: Resúmenes LLM (Groq) — resumen del día + traducción de señales
        run: python scripts/resumir_groq.py --max 24
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        continue-on-error: true

      - name: Ranking de modelos (LMArena + OpenRouter)
        continue-on-error: true
        run: python scripts/actualizar_modelos.py --max 60

      # Fuente de X: monitor de viralidad (17 cuentas + 5 searches de nicho).
      # Soft-fail: si la API de FxEmbed falla, el informe diario sigue igual.
      - name: Señales de X - FxTwitter (cuentas + searches de nicho)
        continue-on-error: true
        run: python scripts/fx_viral.py

      # Evidencia publicada, no solo logs: el JSON queda commiteado junto al
      # informe y la portada lo muestra. El script nunca rompe el run.
      - name: Salud de fuentes
        continue-on-error: true
        run: python scripts/feed_health.py

      - name: Commit cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # datos/ incluye el JSON diario de X (fx_viral_*.json) para que
          # los clips de AutoClip tengan la cola de contenido versionada.
          git add informes web public datos
          if git diff --staged --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Informe diario $(date -u +%Y-%m-%d)"
            git push
          fi

      # Si el ranking quedó vacío o la salud no cubre todos los feeds, el run
      # se pone rojo DESPUÉS de publicar la evidencia.
      - name: Verificar artefactos publicados
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          modelos = json.loads(Path("public/data/modelos.json").read_text(encoding="utf-8"))
          health = json.loads(Path("public/data/feed_health.json").read_text(encoding="utf-8"))
          if modelos.get("total", 0) <= 0:
              raise SystemExit("modelos.json quedó vacío: revisar la fuente de LMArena")
          feeds = health.get("feeds", [])
          if health.get("total_feeds", 0) <= 0 or len(feeds) != health["total_feeds"]:
              raise SystemExit("feed_health.json incompleto")
          feed_xml = Path("public/feed.xml")
          if not feed_xml.exists() or "<item>" not in feed_xml.read_text(encoding="utf-8"):
              raise SystemExit("public/feed.xml ausente o sin items")
          print(
              f"modelos={modelos['total']} con_precio={modelos.get('con_precio', 0)} "
              f"feeds={health.get('ok', 0)}/{health['total_feeds']} "
              f"ranking={health.get('ranking', {}).get('estado')} "
              f"feed_items={feed_xml.read_text(encoding='utf-8').count('<item>')}"
          )
          PY

  # Gate del frontend: MISMA exigencia que antes (typecheck + tests + lint +
  # build), pero ya no puede matar el informe. Si falla, el run queda rojo y
  # llega el email de GitHub, pero el dia ya esta publicado y commiteado.
  # Vercel ademas hace su propio build al deployar.
  gate-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"

      # npm ci exige que package.json y package-lock.json esten en sync.
      - name: Instalar dependencias web
        run: npm ci --no-audit --no-fund

      - name: Typecheck del frontend
        run: npm run typecheck

      - name: Tests del frontend
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
