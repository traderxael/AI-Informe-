name: Informe diario

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: informe-diario
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Gate de tipos + tests del frontend React (TanStack). Sin esto, un
      # componente roto (p. ej. week-view.tsx usando `loading` sin declararlo)
      # llegaba a Vercel y rompia la portada en runtime, no en el build.
      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # npm ci exige que package.json y package-lock.json esten en sync.
      # Abajo se declara lru-cache>=11 explicitamente (ver paso siguiente).
      - name: Instalar dependencias web
        run: npm ci --no-audit --no-fund

      - name: Typecheck del frontend
        run: npm run typecheck

      - name: Tests del frontend
        run: npm test

      - name: Tests de clasificación
        run: python scripts/test_pipeline.py

      - name: Generar informe (markdown + web)
        run: python scripts/generar_informe.py

      - name: Recolectar signals reales (Google News + RSS + Reddit + HN)
        run: python scripts/collect_signals.py
        env:
          TRANSLATE_MAX: "40"

      - name: Resúmenes LLM (Groq) — resumen del día + traducción de señales
        run: python scripts/resumir_groq.py --max 24
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        continue-on-error: true

      - name: Ranking de modelos (LMArena + OpenRouter)
        continue-on-error: true
        run: python scripts/actualizar_modelos.py --max 60

      # Fuente de X: monitor de viralidad (16 cuentas + 4 searches de nicho).
      # Soft-fail: si la API de FxEmbed falla, el informe diario sigue igual.
      - name: Señales de X - FxTwitter (cuentas + searches de nicho)
        continue-on-error: true
        run: python scripts/fx_viral.py

      - name: Commit cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # datos/ incluye el JSON diario de X (fx_viral_*.json) para que
          # los clips de AutoClip tengan la cola de contenido versionada.
          git add informes web public datos
          if git diff --staged --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Informe diario $(date -u +%Y-%m-%d)"
            git push
          fi
