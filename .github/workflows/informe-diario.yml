name: Informe diario

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: informe-diario
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Tests de clasificación
        run: python scripts/test_pipeline.py

      - name: Generar informe (markdown + web)
        run: python scripts/generar_informe.py

      - name: Recolectar signals reales (Google News + RSS + Reddit + HN)
        run: python scripts/collect_signals.py
        env:
          TRANSLATE_MAX: "40"

      - name: Ranking de modelos (LMArena + OpenRouter)
        continue-on-error: true
        run: python scripts/actualizar_modelos.py --max 60

      - name: Commit cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add informes web public
          if git diff --staged --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Informe diario $(date -u +%Y-%m-%d)"
            git push
          fi
